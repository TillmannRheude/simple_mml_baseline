# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: MixUp - Symile
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # MixUp
  modelname.mixup.mixup_alpha:
    values: [0.1, 0.2, 0.4, 0.8]
  modelname.mixup.unimodal_loss_weights:
    values: [[1.0, 1.0, 1.0],[0.5, 0.5, 0.5],[0.2, 0.2, 0.2],[0.1, 0.1, 0.1]]
  modelname.mixup.consistency_loss_weights:
    values: [[1.0, 1.0, 1.0],[0.5, 0.5, 0.5],[0.2, 0.2, 0.2],[0.1, 0.1, 0.1]]
  modelname.mixup.modalities_to_mix:
    values: [[0,1],[1,2],[0,2]]

command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "gpu"
  - "--gres=shard:3"
  - "--job-name=SimBas-MixUp"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="mixup"
  - dataset="mimic_symile"
  - encoders="mimic_symile"
  - wandb.group="None"
  - batch_size=128
  - missing.missing_train=[0.0,0.0]
  - missing.missing_valid=[0.0,0.0]
  - missing.missing_test=[0.0,0.0]
  - ${args_no_hyphens}
