# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: OMIB - Haim
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # Fixed parameters 
  encoders.sequential.transformer.dropout:
    value: 0.2
  encoders.sequential.transformer.intermediate_size:
    value: 1024
  encoders.sequential.transformer.num_attention_heads:
    value: 8
  encoders.sequential.transformer.num_hidden_layers:
    value: 2
  encoders.vision.vit.dropout:
    value: 0.0
  encoders.vision.vit.vit:
    value: "vit_b_32"
  modelname.head_transformer.d_model:
    value: 256
  modelname.head_transformer.dim_feedforward:
    value: 256
  modelname.head_transformer.dropout:
    value: 0.1
  modelname.head_transformer.nhead:
    value: 4
  modelname.head_transformer.num_layers:
    value: 4
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # OMIB
  modelname.omib.beta:
    min: 0.00001 # 1e-5
    max: 0.1 # 1e-1
    distribution: "log_uniform_values"
  modelname.omib.cross_attn_network.num_layers:
    values: [1, 2, 4, 8, 16]
  modelname.omib.cross_attn_network.dropout:
    values: [0.0, 0.1, 0.2]
  modelname.omib.cross_attn_network.num_heads:
    values: [1, 2, 4, 8, 16]
  modelname.omib.cross_attn_network.dim_feedforward:
    values: [128, 256, 512, 1024]
  modelname.omib.warmup_epochs:
    values: [0, 1, 2, 4, 8]


command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "gpu"
  - "--gres=gpu:1"
  - "--job-name=SB-OMIB"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="omib"
  - dataset="mimic_haim"
  - encoders="mimic_haim"
  - wandb.group="None"
  - batch_size=16
  - missing.missing_train=[0.0]
  - missing.missing_valid=[0.0]
  - missing.missing_test=[0.0]
  - ${args_no_hyphens}