modelname: ebr

optimizer:
  name: schedulefree_sgd
  lr: 0.00010944664791024936
  warmup_steps: 1000
  weight_decay: 0.0
  eps: 1e-7
  betas: [0.95, 0.99]
  #sgd 
  momentum: 0.9

pipeline:
  full_seq: False

early_stopping: False 
  
head_transformer:
  d_model: 128
  num_layers: 8
  dim_feedforward: 512
  nhead: 4
  dropout: 0.2

ebr:
  interleave_epochs: 0
  alpha_ebr: 0.01
  hidden_dim: 1024
  d_shared: 512