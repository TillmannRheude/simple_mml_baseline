# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: MCR - MOSI
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # fixed parameters
  # Encoders
  encoders.audio.transformer.num_hidden_layers:
    values: [8]
  encoders.audio.transformer.num_attention_heads:
    values: [4]
  encoders.audio.transformer.intermediate_size:
    values: [512]
  encoders.audio.transformer.dropout:
    values: [0.1]
  encoders.vision.transformer.num_hidden_layers:
    values: [8]
  encoders.vision.transformer.num_attention_heads:
    values: [1]
  encoders.vision.transformer.intermediate_size:
    values: [256]
  encoders.vision.transformer.dropout:
    values: [0.1]
  # Head Transformer
  modelname.head_transformer.d_model:
    values: [256]
  modelname.head_transformer.dim_feedforward:
    values: [2048]
  modelname.head_transformer.dropout:
    values: [0]
  modelname.head_transformer.nhead:
    values: [16]
  modelname.head_transformer.num_layers:
    values: [6]
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # MCR
  modelname.mcr.strategy:
    values: ['Greedy']
  modelname.mcr.loss_weights.mipd:
    min: 0.1
    max: 1.0
    distribution: "log_uniform_values"
  modelname.mcr.loss_weights.con:
    min: 0.1
    max: 1.0
    distribution: "log_uniform_values"
  modelname.mcr.loss_weights.ceb:
    min: 0.1
    max: 1.0
    distribution: "log_uniform_values"
  modelname.mcr.loss_weights.uni:
    values: [[0.1, 0.1, 0.1],[0.2, 0.2, 0.2],[0.3, 0.3, 0.3]]
  modelname.mcr.contrastive_temp:
    min: 0.01
    max: 1.0
    distribution: "log_uniform_values"
  modelname.mcr.ceb_reconstruction_head.hidden_dim:
    values: [32, 64, 128, 256, 512, 1024]
  modelname.mcr.ceb_reconstruction_head.num_layers:
    values: [1, 2, 3]
  modelname.mcr.num_permutations:
    values: [1, 2, 5, 10]

command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "gpu"
  - "--gres=gpu:1"
  - "--job-name=SB"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="mcr"
  - dataset="mosi"
  - encoders="mosi"
  - wandb.group="None"
  - batch_size=128
  - missing.missing_train=[0.0,0.0]
  - missing.missing_valid=[0.0,0.0]
  - missing.missing_test=[0.0,0.0]
  - ${args_no_hyphens}