# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: IMDER - HAIM
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # Fixed parameters 
  encoders.sequential.transformer.dropout:
    value: 0.2
  encoders.sequential.transformer.intermediate_size:
    value: 1024
  encoders.sequential.transformer.num_attention_heads:
    value: 8
  encoders.sequential.transformer.num_hidden_layers:
    value: 2
  encoders.vision.vit.dropout:
    value: 0.0
  encoders.vision.vit.vit:
    value: "vit_b_32"
  modelname.head_transformer.d_model:
    value: 256
  modelname.head_transformer.dim_feedforward:
    value: 256
  modelname.head_transformer.dropout:
    value: 0.1
  modelname.head_transformer.nhead:
    value: 4
  modelname.head_transformer.num_layers:
    value: 4
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # IMDER
  modelname.imder.beta:
    min: 0.01
    max: 1.0
    distribution: "log_uniform_values"
  modelname.ddpms.n_steps:
    values: [10, 20, 30, 40, 50, 100]
  modelname.ddpms.d_model: # fixed 
    value: 256
  modelname.ddpms.hidden_dim:
    values: [32, 64, 128, 256, 512, 1024]
  modelname.ddpms.num_layers:
    values: [1, 2, 3, 4, 5, 6, 7, 8]
  modelname.ddpms.dropout:
    values: [0.0, 0.1, 0.2]
  modelname.ddpms.nhead:  # 128 must be divisible by num_heads
    values: [1, 2, 4, 8, 16, 32]

command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "pgpu"
  - "--gres=gpu:2"
  - "--job-name=SB-IMDer"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="imder"
  - dataset="mimic_haim"
  - encoders="mimic_haim"
  - wandb.group="haim_imder"
  - batch_size=32
  - missing.missing_train=[0.3]
  - missing.missing_valid=[0.3]
  - missing.missing_test=[0.3]
  - ${args_no_hyphens}
