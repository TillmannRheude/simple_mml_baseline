modelname: mcr

optimizer:
  name: schedulefree_adamw
  lr: 1e-3
  warmup_steps: 1000
  weight_decay: 0.0
  eps: 1e-7
  betas: [0.95, 0.99]

pipeline:
  full_seq: False
  
head_transformer:
  d_model: 128
  num_layers: 8
  dim_feedforward: 512
  nhead: 4
  dropout: 0.2

mcr:
  strategy: 'Greedy'  # 'Greedy', 'Collaborative', 'Independent'
  loss_weights:
    mipd: 0.5
    con: 0.5
    ceb: 0.2
    uni: [0.1, 0.1, 0.1]
  contrastive_temp: 0.1
  ceb_reconstruction_head:
    hidden_dim: 512
    num_layers: 2
  num_permutations: 1