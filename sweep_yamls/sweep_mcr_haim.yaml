# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: MCR - HAIM
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # Fixed model parameters
  encoders.sequential.transformer.dropout:
    value: 0.1
  encoders.sequential.transformer.intermediate_size:
    value: 512
  encoders.sequential.transformer.num_attention_heads:
    value: 16
  encoders.sequential.transformer.num_hidden_layers:
    value: 6
  encoders.vision.vit.dropout:
    value: 0.1
  encoders.vision.vit.vit:
    value: "vit_b_16"
  modelname.head_transformer.d_model:
    value: 512
  modelname.head_transformer.dim_feedforward:
    value: 512
  modelname.head_transformer.dropout:
    value: 0.2
  modelname.head_transformer.nhead:
    value: 8
  modelname.head_transformer.num_layers:
    value: 6
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # MCR
  modelname.mcr.strategy:
    values: ['Greedy']
  modelname.mcr.loss_weights.mipd:
    min: 0.1
    max: 1.0
    distribution: "log_uniform_values"
  modelname.mcr.loss_weights.con:
    min: 0.1
    max: 1.0
    distribution: "log_uniform_values"
  modelname.mcr.loss_weights.ceb:
    min: 0.1
    max: 1.0
    distribution: "log_uniform_values"
  modelname.mcr.loss_weights.uni: # must match num modalities 
    values: [[0.1,0.1],[0.2,0.2],[0.3,0.3]]
  modelname.mcr.contrastive_temp:
    min: 0.01
    max: 1.0
    distribution: "log_uniform_values"
  modelname.mcr.ceb_reconstruction_head.hidden_dim:
    values: [32, 64, 128, 256, 512, 1024]
  modelname.mcr.ceb_reconstruction_head.num_layers:
    values: [1, 2, 3]
  modelname.mcr.num_permutations:
    values: [1, 2, 5, 10]

command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "agpu"
  - "--gres=gpu:1"
  - "--job-name=SB-MCR"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="mcr"
  - dataset="mimic_haim"
  - encoders="mimic_haim"
  - wandb.group="None"
  - batch_size=32
  - missing.missing_train=[0.0]
  - missing.missing_valid=[0.0]
  - missing.missing_test=[0.0]
  - ${args_no_hyphens}