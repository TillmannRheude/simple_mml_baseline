modelname: ogm

optimizer:
  name: schedulefree_adamw  # both used in paper, sgd too 
  lr: 3e-4
  warmup_steps: 100
  weight_decay: 0.001
  eps: 1e-7
  betas: [0.95, 0.99]

pipeline:
  full_seq: False
  
head_transformer:
  d_model: 128
  num_layers: 8
  dim_feedforward: 512
  nhead: 4
  dropout: 0.2

ogm:
  alpha: 0.3
  use_ge: True
