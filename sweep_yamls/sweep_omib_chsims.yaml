# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: OMIB - CHSims
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # fixed parameters
  # Encoders
  encoders.audio.transformer.num_hidden_layers:
    values: [4]
  encoders.audio.transformer.num_attention_heads:
    values: [4]
  encoders.audio.transformer.intermediate_size:
    values: [1024]
  encoders.vision.transformer.num_hidden_layers:
    values: [4]
  encoders.vision.transformer.num_attention_heads:
    values: [2]
  encoders.vision.transformer.intermediate_size:
    values: [512]
  # Head Transformer
  modelname.head_transformer.d_model:
    values: [128]
  modelname.head_transformer.dim_feedforward:
    values: [2048]
  modelname.head_transformer.dropout:
    values: [0]
  modelname.head_transformer.nhead:
    values: [16]
  modelname.head_transformer.num_layers:
    values: [6]
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # OMIB
  modelname.omib.beta:
    min: 0.00001 # 1e-5
    max: 0.1 # 1e-1
    distribution: "log_uniform_values"
  modelname.omib.cross_attn_network.num_layers:
    values: [1, 2, 4, 8, 16]
  modelname.omib.cross_attn_network.dropout:
    values: [0.0, 0.1, 0.2]
  modelname.omib.cross_attn_network.num_heads:
    values: [1, 2, 4, 8, 16]
  modelname.omib.cross_attn_network.dim_feedforward:
    values: [128, 256, 512, 1024]
  modelname.omib.warmup_epochs:
    values: [0, 1, 2, 4, 8]


command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "pgpu"
  - "--gres=gpu:2"
  - "--job-name=SB-OMIB"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="omib"
  - dataset="ch_sims"
  - encoders="ch_sims"
  - wandb.group="None"
  - batch_size=16
  - missing.missing_train=[0.0,0.0]
  - missing.missing_valid=[0.0,0.0]
  - missing.missing_test=[0.0,0.0]
  - ${args_no_hyphens}