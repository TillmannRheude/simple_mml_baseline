modelname: smil

optimizer:
  name: schedulefree_adamw
  lr: 0.00017010236178206022
  warmup_steps: 1000
  weight_decay: 0.001
  eps: 1e-7
  betas: [0.95, 0.99]

pipeline:
  full_seq: False
  
head_transformer:
  d_model: 512
  num_layers: 6
  dim_feedforward: 512
  nhead: 8
  dropout: 0.2

smil:
  num_priors: 10
  inner_lr: 0.0001
  alpha: 0.1