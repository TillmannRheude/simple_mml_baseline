defaults:
  - _self_
  - modelname: imder
  - encoders: mimic_symile  # mimic_symile / mimic_haim / mosi / mosei / ch_sims / ch_sims_v2 / crema_d / ukb
  - datamodule: default  # for ukb

dataset: mimic_symile  # mimic_symile / mimic_haim / mosi / mosei / ch_sims / ch_sims_v2 / crema_d / ukb

unimodal: None  # unimodal_0  # unimodal_0, unimodal_1, unimodal_2, ...

split_nr: 2
missing:  # e.g. 2 modalities -> 1 list entry -> defines the percentage of one modality missing
  missing_train: [0.2, 0.2]
  missing_valid: [0.2, 0.2]
  missing_test: [0.2, 0.2]

batch_size: 32

seed: 420
num_workers: 4
precision: "32"
max_epochs: 100
wandb:
  project: "simple_mml_baseline"
  group: None