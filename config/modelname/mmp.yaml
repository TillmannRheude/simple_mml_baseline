modelname: mmp

optimizer:
  name: schedulefree_adamw
  lr: 1e-3
  warmup_steps: 1000
  weight_decay: 0.0
  eps: 1e-7
  betas: [0.95, 0.99]

pipeline:
  full_seq: True
  
head_transformer:
  d_model: 128
  num_layers: 8
  dim_feedforward: 512
  nhead: 4
  dropout: 0.2

mmp:
  proj_mlp:
    hidden_dim: 512
    dropout: 0.0
  attn_steps:
    dropout: 0.0
    nhead: 4
  num_aggregated_tokens: 8
  loss_alignment_alpha: 1.0