modelname: bmml

optimizer:
  name: schedulefree_adamw
  lr: 1e-4
  warmup_steps: 1000
  weight_decay: 0.0
  eps: 1e-7
  betas: [0.95, 0.99]

pipeline:
  full_seq: False
  
head_transformer:
  d_model: 128
  num_layers: 8
  dim_feedforward: 512
  nhead: 4
  dropout: 0.2

bmml:
  unimodal_loss_weight: 1.0
  alpha: 0.01
  q: 5
  warmup_epochs: 1
  bmml_momentum: 0.9