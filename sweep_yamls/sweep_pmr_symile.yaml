# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: PMR - Symile
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # PMR
  modelname.pmr.alpha:
    min: 0.1
    max: 1.0
    distribution: "log_uniform_values"
  modelname.pmr.mu:
    min: 1.0e-5
    max: 1.0e-1
    distribution: "log_uniform_values"
  modelname.pmr.regularization_epochs:
    values: [0, 1, 2, 4, 8]
  modelname.pmr.num_bins_regression:
    values: [2, 4, 8, 16, 32]
  modelname.pmr.epsilon:
    min: 0.1
    max: 1.0
    distribution: "log_uniform_values"

command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "gpu"
  - "--gres=shard:2"
  - "--job-name=SB-PMR"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="pmr"
  - dataset="mimic_symile"
  - encoders="mimic_symile"
  - wandb.group="None"
  - batch_size=128
  - missing.missing_train=[0.0,0.0]
  - missing.missing_valid=[0.0,0.0]
  - missing.missing_test=[0.0,0.0]
  - ${args_no_hyphens}
