# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: SimBaMM (Full Seq) - Symile
method: bayes  # grid 
metric:
  name: val/loss
  goal: minimize

parameters:
  # Encoders
  #encoders.vision.vit.vit:
  #  values: ["vit_b_16", "vit_b_32"]
  #encoders.vision.vit.dropout:
  #  values: [0, 0.1, 0.2]
  #encoders.sequential1.transformer.num_hidden_layers:
  #  values: [2, 4, 6, 8]
  #encoders.sequential1.transformer.num_attention_heads:
  #  values: [2, 4, 8, 16]
  #encoders.sequential1.transformer.intermediate_size:
  #  values: [256, 512, 1024, 2048]
  #encoders.sequential1.transformer.dropout:
  #  values: [0, 0.1, 0.2]
  #encoders.sequential2.mlp.hidden_dims:
  #  values: [[256, 512, 256], [512, 1024, 512], [1024, 2048, 1024]]
  #encoders.sequential2.mlp.hidden_dropouts:
  #  values: [[0, 0, 0], [0.1, 0.1, 0.1], [0.2, 0.2, 0.2]]
  # Head Transformer
  #modelname.head_transformer.d_model:
  #  values: [32, 64, 128, 256, 512]
  #modelname.head_transformer.dim_feedforward:
  #  values: [256, 512, 1024, 2048]
  #modelname.head_transformer.dropout:
  #  values: [0, 0.1, 0.2]
  #modelname.head_transformer.nhead:
  #  values: [4, 8, 16]
  #modelname.head_transformer.num_layers:
  #  values: [2, 4, 6, 8]
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]

command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "gpu"
  - "--gres=shard:1"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="transformer"
  - dataset="mimic_symile"
  - encoders="mimic_symile"
  - wandb.group="symile_transformer"
  - batch_size=128
  - missing.missing_train=[0.0,0.0]
  - missing.missing_valid=[0.0,0.0]
  - missing.missing_test=[0.0,0.0]
  - ${args_no_hyphens}