# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: ALBEF - Symile
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # ALBEF
  modelname.itc.dim:
    values: [32, 64, 128, 256, 512, 1024]
  modelname.itc.temperature:
    min: 0.01
    max: 1.0
    distribution: "log_uniform_values"
  modelname.itc.weight:
    min: 0.01
    max: 1.0
    distribution: "log_uniform_values"
  modelname.itc.momentum:
    values: [0.990, 0.995, 0.999]
  modelname.itm.weight:
    min: 0.01
    max: 1.0
    distribution: "log_uniform_values"
  modelname.distill.temperature:
    min: 0.01
    max: 10.0
    distribution: "log_uniform_values"

command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "gpu"
  - "--gres=gpu:1"
  - "--job-name=SimBas-ALBEF"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="albef"
  - dataset="mimic_symile"
  - encoders="mimic_symile"
  - wandb.group="symile_albef"
  - batch_size=32
  - missing.missing_train=[0.0,0.0]
  - missing.missing_valid=[0.0,0.0]
  - missing.missing_test=[0.0,0.0]
  - ${args_no_hyphens}
