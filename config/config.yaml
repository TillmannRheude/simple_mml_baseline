defaults:
  - modelname@model: transformer
  - encoders@encoder: ukb
  - datamodule@data: default
  - _self_

seed: 420

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  log_every_n_steps: 1
  early_stopping_patience: 20
  test_after_fit: true

wandb:
  project: simbamm_ukb
  group: null
  mode: online
  save_dir: wandb
