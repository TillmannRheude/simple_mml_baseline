# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: GBlend Online - Symile
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # GBlend
  modelname.gblend.mode:
    values: ['online']
  modelname.gblend.update_freq:
    values: [1, 5, 10]
  modelname.gblend.lookahead_epochs:
    values: [1, 3, 5]

command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "pgpu"
  - "--gres=gpu:2"
  - "--job-name=SimBas-GBlend"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="gblend"
  - dataset="mimic_symile"
  - encoders="mimic_symile"
  - wandb.group="symile_gblend"
  - batch_size=128
  - missing.missing_train=[0.0,0.0]
  - missing.missing_valid=[0.0,0.0]
  - missing.missing_test=[0.0,0.0]
  - ${args_no_hyphens}
