modelname: albef

optimizer:
  name: schedulefree_adamw
  lr: 3e-4
  warmup_steps: 100
  weight_decay: 0.001
  eps: 1e-7
  betas: [0.95, 0.99]

pipeline:
  full_seq: True
  
head_transformer:
  d_model: 128
  num_layers: 8
  dim_feedforward: 512
  nhead: 4
  dropout: 0.2

itc:
  dim: 256
  temperature: 0.7
  weight: 1.0
  queue_size: 4096  # 65536
  momentum: 0.995

itm:
  weight: 1.0

distill:
  temperature: 0.1