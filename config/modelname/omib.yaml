modelname: omib

optimizer:
  name: schedulefree_adamw
  lr: 0.00017010236178206022
  warmup_steps: 1000
  weight_decay: 0.001
  eps: 1e-7
  betas: [0.95, 0.99]

pipeline:
  full_seq: True
  
head_transformer:
  d_model: 128
  num_layers: 8
  dim_feedforward: 512
  nhead: 4
  dropout: 0.2
  
omib:
  warmup_epochs: 1
  beta: 1e-3
  cross_attn_network:
    num_layers: 4
    dropout: 0.0
    num_heads: 4
    dim_feedforward: 512