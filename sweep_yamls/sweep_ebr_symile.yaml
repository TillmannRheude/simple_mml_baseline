# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: EBR (SGD, noEarlyStopping) - Symile
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  modelname.optimizer.momentum:
    values: [0.9, 0.95, 0.99]
  # EBR
  modelname.ebr.alpha_ebr:
    min: 0.001
    max: 1.0
    distribution: "log_uniform_values"
  modelname.ebr.interleave_epochs:
    values: [0]  # , 2, 4, 6, 8, 10, 20
  modelname.ebr.hidden_dim:
    values: [128, 256, 512, 1024, 2048]
  modelname.ebr.d_shared:
    values: [128, 256, 512, 1024, 2048]

command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "pgpu"
  - "--gres=gpu:2"
  - "--job-name=SimBas-EBR"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="ebr"
  - dataset="mimic_symile"
  - encoders="mimic_symile"
  - wandb.group="None"
  - batch_size=128
  - missing.missing_train=[0.0,0.0]
  - missing.missing_valid=[0.15,0.15]
  - missing.missing_test=[0.15,0.15]
  - ${args_no_hyphens}