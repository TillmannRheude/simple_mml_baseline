# sweep.yaml
program: /sc-projects/sc-proj-ukb-cvd/projects/simple_mml_baseline_tr/main.py
project: simple_mml_baseline
name: IMDer - MOSI
method: bayes
metric:
  name: val/loss
  goal: minimize

parameters:
  # fixed parameters
  # Encoders
  encoders.audio.transformer.num_hidden_layers:
    values: [8]
  encoders.audio.transformer.num_attention_heads:
    values: [4]
  encoders.audio.transformer.intermediate_size:
    values: [512]
  encoders.audio.transformer.dropout:
    values: [0.1]
  encoders.vision.transformer.num_hidden_layers:
    values: [8]
  encoders.vision.transformer.num_attention_heads:
    values: [1]
  encoders.vision.transformer.intermediate_size:
    values: [256]
  encoders.vision.transformer.dropout:
    values: [0.1]
  # Head Transformer
  modelname.head_transformer.d_model:
    values: [256]
  modelname.head_transformer.dim_feedforward:
    values: [2048]
  modelname.head_transformer.dropout:
    values: [0]
  modelname.head_transformer.nhead:
    values: [16]
  modelname.head_transformer.num_layers:
    values: [6]
  # Optimizer
  modelname.optimizer.lr:
    min: 0.000001
    max: 0.1
    distribution: "log_uniform_values"
  modelname.optimizer.warmup_steps:
    values: [0, 100, 200, 500, 1000]
  modelname.optimizer.weight_decay:
    values: [0, 0.1, 0.01, 0.001]
  # IMDER
  modelname.imder.beta:
    min: 0.01
    max: 1.0
    distribution: "log_uniform_values"
  modelname.ddpms.n_steps:
    values: [10, 20, 30, 40, 50, 100]
  modelname.ddpms.d_model: # fixed 
    value: 256
  modelname.ddpms.hidden_dim:
    values: [32, 64, 128, 256, 512, 1024]
  modelname.ddpms.num_layers:
    values: [1, 2, 3, 4, 5, 6, 7, 8]
  modelname.ddpms.dropout:
    values: [0.0, 0.1, 0.2]
  modelname.ddpms.nhead:  # 128 must be divisible by num_heads
    values: [1, 2, 4, 8, 16, 32]


command:
  - ${env}
  - srun
  - "-N"
  - "1-1"
  - "-T"
  - "32"
  - "-p"
  - "pgpu"
  - "--gres=gpu:2"
  - "--job-name=SB"
  - "--mem=200G"
  - "--time"
  - "48:00:00"
  - "python3"
  - ${program}
  - --config-name=config
  - modelname="imder"
  - dataset="mosi"
  - encoders="mosi"
  - wandb.group="None"
  - batch_size=128
  - missing.missing_train=[0.15,0.15]
  - missing.missing_valid=[0.15,0.15]
  - missing.missing_test=[0.15,0.15]
  - ${args_no_hyphens}