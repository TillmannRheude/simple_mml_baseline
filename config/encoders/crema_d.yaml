defaults:
  - _self_

use_embeddings: False

audio:
  vit:  # not used currently, ResNet1 encoder used instead
    dim: 256
    heads: 2
    depth: 2
    mlp_dim: 1024
    dropout: 0.0

vision:
  vit:  # not used currently, ResNet1 encoder used instead
    dim: 256
    heads: 2
    depth: 2
    mlp_dim: 1024
    dropout: 0.0

monitor:
  metric: "val/acc"
  mode: "max"