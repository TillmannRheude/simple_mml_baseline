modelname: mixup

optimizer:
  name: schedulefree_adamw
  lr: 1e-3
  warmup_steps: 1000
  weight_decay: 0.0
  eps: 1e-7
  betas: [0.95, 0.99]

pipeline:
  full_seq: False
  
head_transformer:
  d_model: 128
  num_layers: 8
  dim_feedforward: 512
  nhead: 4
  dropout: 0.2

mixup:
  mixup_alpha: 0.2
  unimodal_loss_weights: [1.0, 1.0, 1.0]
  consistency_loss_weights: [1.0, 1.0]
  modalities_to_mix: [0, 1]
  consistency_loss_type: "mse"