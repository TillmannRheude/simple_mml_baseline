modelname: pmr

optimizer:
  name: schedulefree_adamw
  lr: 1e-3
  warmup_steps: 1000
  weight_decay: 0.0
  eps: 1e-7
  betas: [0.95, 0.99]

pipeline:
  full_seq: False
  
head_transformer:
  d_model: 128
  num_layers: 8
  dim_feedforward: 512
  nhead: 4
  dropout: 0.2

pmr:
  alpha: 1.0
  mu: 1e-3
  regularization_epochs: 10
  num_bins_regression: 10
  epsilon: 0.99